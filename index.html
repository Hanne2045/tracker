<style>
:root{--bg:#0b0b0d;--tx:#f4f4f6;--mu:#8e8e93;--ac:#c6ff3d;--ak:#c6ff3d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px -apple-system,system-ui,sans-serif;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.w{max-width:520px;margin:0 auto;padding:10px 14px 130px}
h1{font-size:34px;letter-spacing:-.03em;margin:6px 0}
h2{font-size:18px;margin:22px 0 10px}
.mu{color:var(--mu)}p.mu{margin:4px 0 12px}
.gl{background:#161618;border:1px solid rgba(255,255,255,.07);border-radius:28px;margin-bottom:10px}
.fl{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.top h1{margin:0}
.rb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pc{position:relative;height:230px;border-radius:28px;overflow:hidden;margin-bottom:12px;padding:12px;background-size:cover;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start}
.pc.hero{height:190px;cursor:default}
.pill{border-radius:999px;padding:7px 14px;font-size:13px}
.tt{position:absolute;left:14px;bottom:-14px;font-size:78px;line-height:1;font-weight:800;letter-spacing:-.05em;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.08));-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;white-space:nowrap}

.bar{display:flex;justify-content:space-between;padding:14px 20px;gap:10px;align-items:center}
.bar small{display:block;font-size:12px}.bar b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto;background:#fff;color:#000;border-radius:999px;padding:15px 28px;font-weight:600;min-width:210px}
.btn.ac{background:var(--ac);color:#0b1300}
.row{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border:1px solid rgba(255,255,255,.16);border-radius:30px;margin-bottom:10px;cursor:pointer}
.row b{font-weight:500;font-size:17px}.row small{display:block;color:var(--mu);margin-top:3px;font-size:13px}
.upb{display:inline-flex;align-items:center;gap:5px;margin-left:8px;color:#5fe08a;font-size:15px;font-weight:600}
.upb i,.ar{font-style:normal;width:20px;height:20px;border-radius:50%;background:#34c759;color:#04210f;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.ar{width:28px;height:28px;font-size:15px;font-weight:700}
.cnt{color:var(--mu);font-size:15px}
.mp{display:flex;align-items:center;justify-content:space-between;padding:16px;gap:8px}
.cl{display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.ch{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:7px 14px 7px 8px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);color:var(--mu)}
.ch i{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.ch.p{border-color:var(--ac);color:var(--tx)}.ch.p i{background:var(--ac);border-color:var(--ac);color:#0b1300}
.figs{display:flex;gap:6px}.fig{height:165px;width:auto;display:block;flex:none}
.a.s{opacity:.4}
.sg{display:flex;gap:12px;align-items:center;padding:16px 18px}
.lg{padding:14px}
.in{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.in .btn{grid-column:1/3;margin:2px 0 6px;width:100%}
label{font-size:13px;color:var(--mu)}
input,textarea{display:block;width:100%;margin-top:4px;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:#0b0b0d;color:var(--tx);font:600 20px -apple-system,system-ui,sans-serif}
textarea{font-size:14px;font-weight:400;margin-bottom:8px}
.st{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}.st b{flex:1;font-weight:600}
.x{color:var(--mu);padding:4px 8px;font-size:14px}
.hs{padding:14px 18px}.hd{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.stats{display:flex;justify-content:space-between;margin:10px 0}.stats small{display:block;color:var(--mu);font-size:12px}.stats b{font-size:18px}
.en{font-weight:600;margin-top:12px}
.cal{padding:16px}.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cn button{width:36px;height:36px;font-size:24px}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.gr i{font-style:normal;color:var(--mu);font-size:12px;padding-bottom:2px}
.dy{aspect-ratio:1;border-radius:50%;font-size:13px;color:var(--mu);border:1.5px solid transparent;display:flex;align-items:center;justify-content:center}
.dy.on{background:#fff;color:#000;font-weight:700}.dy.td{border-color:var(--ac)}.dy.sl{box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:#161618;border:1px solid rgba(255,255,255,.07);border-radius:28px;padding:16px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.tile small{font-size:14px}.tile b{font-size:38px;color:var(--ac);letter-spacing:-.02em}.tile span{color:var(--mu);font-size:12px}
.ch2{padding:12px}.ch2 svg{width:100%}.cap{display:flex;justify-content:space-between;font-size:12px}
.pad{padding:16px}
